{% extends "base.html" %}

{% block title %}Settings - {{ project.name }}{% endblock %}

{% block content %}
<div style="max-width: 900px; margin: 0 auto; padding: 12px 0 32px;">
    <!-- Page Header -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <a href="{{ url_for('projects.project_detail', project_id=project.id) }}" class="header-icon-btn" title="Back to Project">
                <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
            </a>
            <div>
                <h1 style="font-size: 20px; font-weight: 700; margin: 0; color: var(--text-primary);">Project Settings</h1>
                <p style="font-size: 13px; color: var(--text-secondary); margin: 2px 0 0;">{{ project.name }} ({{ project.key }})</p>
            </div>
        </div>
        <a href="{{ url_for('projects.project_detail', project_id=project.id) }}" class="btn btn-secondary btn-sm" style="display: inline-flex; align-items: center; gap: 6px;">
            <i data-lucide="external-link" style="width: 14px; height: 14px;"></i>
            View Overview
        </a>
    </div>

    <!-- Settings Card -->
    <div class="bento-card" style="padding: 0; overflow: hidden; border-radius: 12px;">
        <!-- Tab Navigation -->
        <div style="display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--surface-border-color); background: rgba(255, 255, 255, 0.02);">
            <button type="button" class="tab-btn active" style="padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: 8px; background: rgba(99, 102, 241, 0.15); color: #818CF8; border: 1px solid rgba(99, 102, 241, 0.3); cursor: pointer;">
                General
            </button>
            <button type="button" class="tab-btn" style="padding: 8px 16px; font-size: 13px; font-weight: 500; border-radius: 8px; background: transparent; color: var(--text-secondary); border: 1px solid transparent; cursor: pointer;">
                Access & Permissions
            </button>
            <button type="button" class="tab-btn" style="padding: 8px 16px; font-size: 13px; font-weight: 500; border-radius: 8px; background: transparent; color: var(--text-secondary); border: 1px solid transparent; cursor: pointer;">
                Workflow & Statuses
            </button>
            <button type="button" class="tab-btn" style="padding: 8px 16px; font-size: 13px; font-weight: 500; border-radius: 8px; background: transparent; color: var(--text-secondary); border: 1px solid transparent; cursor: pointer;">
                Advanced
            </button>
        </div>

        <!-- General Settings Form -->
        <div style="padding: 24px;">
            <form method="POST" action="{{ url_for('admin.edit_project', project_id=project.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div style="display: flex; flex-direction: column; gap: 20px;">
                    <!-- Project Name -->
                    <div class="form-group">
                        <label class="form-label" style="display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px;">Project Name *</label>
                        <input type="text" name="name" value="{{ project.name }}" required class="form-input" style="width: 100%;">
                    </div>

                    <!-- Project Key -->
                    <div class="form-group">
                        <label class="form-label" style="display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px;">Project Key *</label>
                        <input type="text" name="key" value="{{ project.key }}" required class="form-input" pattern="[A-Z0-9]+" maxlength="10" style="width: 100%;">
                        <p style="font-size: 11px; color: var(--text-tertiary); margin: 6px 0 0;">Uppercase letters and numbers only, max 10 characters.</p>
                    </div>

                    <!-- Description -->
                    <div class="form-group">
                        <label class="form-label" style="display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px;">Description</label>
                        <textarea name="description" rows="4" class="form-input" style="width: 100%; resize: vertical;">{{ project.description or '' }}</textarea>
                    </div>

                    <!-- Workflow & Status Grid -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label class="form-label" style="display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px;">Workflow Type</label>
                            <select name="workflow" class="form-select" style="width: 100%;">
                                <option value="Agile" {{ 'selected' if project.workflow == 'Agile' else '' }}>Agile</option>
                                <option value="Kanban" {{ 'selected' if project.workflow == 'Kanban' else '' }}>Kanban</option>
                                <option value="Waterfall" {{ 'selected' if project.workflow == 'Waterfall' else '' }}>Waterfall</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" style="display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px;">Status</label>
                            <select name="status" class="form-select" style="width: 100%;">
                                <option value="active" {{ 'selected' if project.status == 'active' else '' }}>Active</option>
                                <option value="planning" {{ 'selected' if project.status == 'planning' else '' }}>Planning</option>
                                <option value="on_hold" {{ 'selected' if project.status == 'on_hold' else '' }}>On Hold</option>
                                <option value="completed" {{ 'selected' if project.status == 'completed' else '' }}>Completed</option>
                                <option value="archived" {{ 'selected' if project.status == 'archived' else '' }}>Archived</option>
                            </select>
                        </div>
                    </div>

                    <!-- Team Selection -->
                    <div class="form-group">
                        <label class="form-label" style="display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px;">Team</label>
                        <select name="team_id" class="form-select" style="width: 100%;">
                            <option value="">No Team Assigned</option>
                            {% for team in teams %}
                            <option value="{{ team.id }}" {{ 'selected' if project.team_id == team.id else '' }}>
                                {{ team.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Dates Grid -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label class="form-label" style="display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px;">Start Date</label>
                            <input type="date" name="start_date" 
                                   value="{{ project.start_date.strftime('%Y-%m-%d') if project.start_date else '' }}"
                                   class="form-input" style="width: 100%;">
                        </div>
                        <div class="form-group">
                            <label class="form-label" style="display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px;">End Date</label>
                            <input type="date" name="end_date"
                                   value="{{ project.end_date.strftime('%Y-%m-%d') if project.end_date else '' }}"
                                   class="form-input" style="width: 100%;">
                        </div>
                    </div>

                    <!-- Action Buttons Footer -->
                    <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 20px; border-top: 1px solid var(--surface-border-color); margin-top: 8px;">
                        <button type="button" onclick="if(confirm('Are you sure you want to delete this project?')) { /* Implement delete */ }" 
                                class="btn btn-ghost" style="color: #EF4444; gap: 6px;">
                            <i data-lucide="trash-2" style="width: 15px; height: 15px;"></i>
                            Delete Project
                        </button>
                        <div style="display: flex; gap: 10px;">
                            <a href="{{ url_for('projects.project_detail', project_id=project.id) }}" class="btn btn-secondary">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 6px;">
                                <i data-lucide="save" style="width: 15px; height: 15px;"></i>
                                Save Changes
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }
});
</script>
{% endblock %}
