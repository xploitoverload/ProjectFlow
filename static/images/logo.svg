<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="pf-primary" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#6366F1"/>
            <stop offset="50%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#D946EF"/>
        </linearGradient>
        <linearGradient id="pf-accent" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#6366F1"/>
        </linearGradient>
        <linearGradient id="pf-glow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#818CF8" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
        </linearGradient>
        <filter id="glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7C3AED" flood-opacity="0.45"/>
        </filter>
    </defs>

    <!-- Ambient Glow & Backdrop -->
    <rect width="64" height="64" rx="16" fill="#0B0D14"/>
    <rect width="64" height="64" rx="16" fill="url(#pf-glow)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <!-- Dynamic Flow Layers (Modern Isometric Flow) -->
    <g filter="url(#glow-shadow)">
        <!-- Layer 1: Velocity Base -->
        <path d="M16 38L32 46L48 38L32 30L16 38Z" fill="#4338CA" fill-opacity="0.7"/>
        
        <!-- Layer 2: Intermediate Flow -->
        <path d="M16 28L32 36L48 28L32 20L16 28Z" fill="url(#pf-accent)" fill-opacity="0.85"/>
        
        <!-- Layer 3: Apex Velocity Prism -->
        <path d="M16 18L32 26L48 18L32 10L16 18Z" fill="url(#pf-primary)"/>
        
        <!-- Center Kinetic Light Accent -->
        <circle cx="32" cy="26" r="2.5" fill="#FFFFFF"/>
    </g>
</svg>
